 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-20" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>String Interpolation Example</title>
</head>
<body>

  <label>First Name:</label>
  <input type="text" id="firstName" placeholder="Enter First Name"><br><br>

  <label>Last Name:</label>
  <input type="text" id="lastName" placeholder="Enter Last Name"><br><br>

  <button onclick="showFullName()">Show Full Name</button>

  <p id="result"></p>

  <script>
    function showFullName() {
      const firstName = document.getElementById("firstName").value;
      const lastName = document.getElementById("lastName").value;

      // String interpolation
      const fullName = `${firstName} ${lastName}`;

      document.getElementById("result").innerHTML = `Full Name: ${fullName}`;
    }
  </script>

</body>
</html>
